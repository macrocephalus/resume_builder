packages:
  - frontend
  - backend
  - shared

# Install scripts: @swc/core fetches its native binary; argon2 picks its prebuilt binary (and
# compiles only if none fits); esbuild and msgpackr-extract have platform packages / JS
# fallbacks and need none
allowBuilds:
  '@swc/core': true
  argon2: true
  esbuild: false
  msgpackr-extract: false

# `pnpm deploy` (backend Docker image) copies workspace deps like `shared` as real files
injectWorkspacePackages: true
