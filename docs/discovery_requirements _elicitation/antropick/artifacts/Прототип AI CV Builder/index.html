<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Прототип AI CV Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: приложение в одну колонку до 1120px; на телефоне экраны резюме переключаются вкладками, на ПК редактор и боковая панель стоят рядом */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#131926; --muted:#586174;
  --line:#D6DCE8; --line-strong:#AEB8CB;
  --accent:#1F4FD1; --accent-soft:#E6ECFB; --on-accent:#FFFFFF;
  --wait:#955800; --wait-soft:#FBF0DC;
  --ok:#1B7A4B; --ok-soft:#E2F3EA;
  --bad:#B4372B; --bad-soft:#FBE7E4;
  --paper:#FFFFFF; --paper-ink:#16181D; --paper-muted:#5A6070; --paper-line:#D5D8DF;
  --font-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --font-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131B; --surface:#171C27; --ink:#E7EBF3; --muted:#9AA4B8;
    --line:#2A3142; --line-strong:#465069;
    --accent:#86A6FF; --accent-soft:#1B2540; --on-accent:#0F131B;
    --wait:#E3AA52; --wait-soft:#2E2413;
    --ok:#62C792; --ok-soft:#14291F;
    --bad:#F08A80; --bad-soft:#331A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171C27; --ink:#E7EBF3; --muted:#9AA4B8;
  --line:#2A3142; --line-strong:#465069;
  --accent:#86A6FF; --accent-soft:#1B2540; --on-accent:#0F131B;
  --wait:#E3AA52; --wait-soft:#2E2413;
  --ok:#62C792; --ok-soft:#14291F;
  --bad:#F08A80; --bad-soft:#331A18;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
h1,h2,h3,p,ul,ol,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--font-display);font-weight:600;font-size:15px;background:none;border:0;padding:6px 0;cursor:pointer}
.spacer{flex:1}
.who{font-family:var(--font-mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:40vw}
.demo-strip{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.demo-strip .wrap{padding-block:7px}
main.wrap{padding-block:24px 72px;display:flex;flex-direction:column;gap:24px}

h1{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.4vw,30px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
h2{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.3}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono{font-family:var(--font-mono);font-size:12.5px}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn-ghost:hover{border-color:transparent;text-decoration:underline}
.btn-danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn-sm{min-height:32px;padding:4px 10px;font-size:13.5px}
.btn-block{width:100%}

/* поля */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.in{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea.in{resize:vertical;line-height:1.45}
.in:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* сообщения */
.notice{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;background:var(--surface)}
.notice.err{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}

/* статусы */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;border:1px solid;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.queued{color:var(--wait);background:var(--wait-soft)}
.pill.running{color:var(--accent);background:var(--accent-soft)}
.pill.completed{color:var(--ok);background:var(--ok-soft)}
.pill.failed{color:var(--bad);background:var(--bad-soft)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--accent);border-radius:2px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%;opacity:.5}}

/* вход */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start;padding-block:16px}
.auth-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:16px}
.auth-side{display:flex;flex-direction:column;gap:16px}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding-block:8px;border-top:1px solid var(--line);font-size:15px}
.steps li span:first-child{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:2px}

/* список резюме */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item-title{font-weight:600;overflow-wrap:anywhere}
.item-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.item-wide{grid-column:1 / -1}
.tag{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:3px;padding:0 6px;color:var(--muted)}
.empty{padding:28px 16px;text-align:left;color:var(--muted)}
details.hood{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.hood summary{cursor:pointer;padding:12px 16px;font-weight:500}
details.hood .hood-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:16px;height:16px;flex:none}

/* экран резюме */
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:38px;font-size:14px;font-weight:500;cursor:pointer;border-left:1px solid var(--line-strong);color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cv-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.panel{min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.entry:first-of-type{border-top:0;padding-top:0}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border:1px solid var(--accent);border-radius:8px;background:var(--surface);padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);padding:5px 12px;min-height:34px;font-size:14px;cursor:pointer;text-align:left}
.chip[disabled]{opacity:.5;cursor:default}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.qcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard.confirm{border-color:var(--wait)}
.quote{border-left:3px solid var(--wait);padding:2px 0 2px 10px;font-size:15px;overflow-wrap:anywhere}

/* лист A4 */
.sheet-wrap{container-type:inline-size;min-width:0}
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line-strong);aspect-ratio:210 / 297;max-width:100%;padding:8.4cqw;font-family:'Liberation Sans',Arial,Helvetica,sans-serif;font-size:1.78cqw;line-height:1.4;overflow-wrap:anywhere}
.sheet .s-name{font-size:3.4cqw;font-weight:700;line-height:1.2}
.sheet .s-contacts{color:var(--paper-muted);font-size:1.6cqw;margin-top:.6cqw;overflow-wrap:anywhere}
.sheet .s-h{font-size:1.5cqw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--paper-line);padding-bottom:.5cqw;margin-top:2.6cqw;margin-bottom:1cqw}
.sheet .s-job{font-weight:700;margin-top:1.2cqw}
.sheet .s-meta{color:var(--paper-muted);font-size:1.6cqw}
.sheet ul{list-style:disc;padding-left:2.4cqw;margin-top:.4cqw}
.sheet .s-empty{color:var(--paper-muted)}

@media (min-width:980px){
  .wrap{padding-inline:24px}
  .cv-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:start}
}
@media (max-width:760px){
  .auth{grid-template-columns:minmax(0,1fr);gap:24px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr)}
  .item-actions{justify-content:flex-start}
}
</style>

<div id="root"><div class="wrap" style="padding-block:40px"><p class="muted">Загружаем прототип…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
'use strict';
if(!window.React||!window.ReactDOM||!window.htm){
  document.getElementById('root').innerHTML='<div class="wrap" style="padding-block:40px"><p>Не удалось загрузить библиотеки интерфейса. Обновите страницу.</p></div>';
  return;
}
const {useState,useEffect,useRef,useCallback}=React;
const html=htm.bind(React.createElement);

const URLS={
  jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  pdfjs:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfworker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  fontRegular:'fonts/LiberationSans-Regular.ttf',
  fontBold:'fonts/LiberationSans-Bold.ttf'
};
const LIMITS={perHour:10,active:2,maxAttempts:3,textMin:80,textMax:20000,roleMax:100,pdfBytes:5*1024*1024,pdfPages:10};
const STAGES={prompt:'Собираем промпт',generate:'Модель пишет черновик',verify:'Сверяем факты с исходником',save:'Сохраняем резюме и вопросы'};
const STATUS_LABEL={queued:'в очереди',running:'выполняется',completed:'готово',failed:'ошибка'};

/* ================= хранилище: заменяет PostgreSQL ================= */
const KEY='cvb.proto.v1';
const fresh=()=>({users:[],cvs:[],jobs:[],questions:[],session:null,flags:{failFirst:false},seeded:false});
function loadDb(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r));}catch(e){}return fresh();}
let db=loadDb();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function lsGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSet(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const has=v=>typeof v==='string'&&v.trim().length>0;

/* ================= схема резюме и проверка ответа модели ================= */
const S=(v,max)=>typeof v==='string'?v.replace(/\s+/g,' ').trim().slice(0,max||300):'';
const A=(v,max)=>Array.isArray(v)?v.slice(0,max):[];
const norm=s=>String(s).toLowerCase().replace(/[«»"“”„'’`]/g,'').replace(/[‐‑–—−]/g,'-').replace(/ё/g,'е').replace(/\s+/g,' ').trim();

function shapeCv(raw){
  raw=isObj(raw)?raw:{};
  const c=isObj(raw.contact)?raw.contact:{};
  return {
    contact:{fullName:S(c.fullName,120),email:S(c.email,120),phone:S(c.phone,40),city:S(c.city,80),links:A(c.links,5).map(l=>S(l,200)).filter(Boolean)},
    summary:S(raw.summary,1200),
    experience:A(raw.experience,10).filter(isObj).map(e=>({id:S(e.id,40)||uid(),title:S(e.title,120),company:S(e.company,120),period:S(e.period,60),bullets:A(e.bullets,12).map(b=>S(b,400))})),
    education:A(raw.education,6).filter(isObj).map(e=>({id:S(e.id,40)||uid(),school:S(e.school,160),degree:S(e.degree,160),years:S(e.years,60)})),
    skills:A(raw.skills,40).map(s=>S(s,60)).filter(Boolean)
  };
}
function cleanCv(raw){
  const cv=shapeCv(raw);
  cv.experience.forEach(e=>{e.bullets=e.bullets.filter(Boolean);});
  return cv;
}
const TARGET=/^(?:contact\.(fullName|phone|email|city)|(summary)|(skills)|experience\[(\d+)\]\.(period|company|title|bullets)|education\[(\d+)\]\.(years|degree|school))$/;
function toRef(target,cv){
  const m=TARGET.exec(String(target||'').replace(/\s/g,''));
  if(!m)return null;
  if(m[1])return {section:'contact',field:m[1]};
  if(m[2])return {section:'summary'};
  if(m[3])return {section:'skills'};
  if(m[4]!==undefined){const e=cv.experience[+m[4]];return e?{section:'experience',id:e.id,field:m[5]}:null;}
  const ed=cv.education[+m[6]];return ed?{section:'education',id:ed.id,field:m[7]}:null;
}
const sameRef=(a,b)=>a.section===b.section&&a.field===b.field&&a.id===b.id;

/* Ответ модели считается недоверенным: всё, что не подтверждено исходником, уходит в вопросы. */
function verifyOutput(raw,source,facts){
  if(!isObj(raw)||!isObj(raw.cv)){const e=new Error('Модель вернула ответ не по схеме.');e.fatal=true;throw e;}
  const cv=shapeCv(raw.cv);
  const hay=norm(source+'\n'+(facts||[]).map(f=>f.answer).join('\n'));
  const hayDigits=hay.replace(/\D/g,'');
  const inHay=v=>norm(v).length>1&&hay.includes(norm(v));
  const report={verified:0,unverified:0,skillsMoved:0,contactCleared:0};
  const questions=[];

  ['fullName','email','city'].forEach(k=>{if(cv.contact[k]&&!inHay(cv.contact[k])){cv.contact[k]='';report.contactCleared++;}});
  if(cv.contact.phone){const d=cv.contact.phone.replace(/\D/g,'');if(d.length<7||!hayDigits.includes(d)){cv.contact.phone='';report.contactCleared++;}}
  cv.contact.links=cv.contact.links.filter(l=>inHay(l.replace(/^https?:\/\//i,'').replace(/\/$/,'')));

  const ev={};
  A(raw.evidence,300).forEach(e=>{if(isObj(e))ev[S(e.path,60).replace(/\s/g,'')]=S(e.quote,400);});
  const pending=[];
  cv.experience.forEach((e,i)=>{
    const kept=[];
    e.bullets.forEach((b,j)=>{
      if(!b)return;
      const q=ev['experience['+i+'].bullets['+j+']'];
      if(q&&norm(q).length>=8&&hay.includes(norm(q))){kept.push(b);report.verified++;}
      else{pending.push({id:e.id,text:b});report.unverified++;}
    });
    e.bullets=kept;
  });

  const suggested=A(raw.suggestedSkills,10).map(s=>S(s,60)).filter(Boolean);
  cv.skills=cv.skills.filter(s=>{if(inHay(s))return true;suggested.push(s);report.skillsMoved++;return false;});

  pending.slice(0,5).forEach(p=>questions.push({kind:'confirm',text:'В исходном тексте нет подтверждения этому пункту. Он верен?',payload:p.text,options:[],label:'',ref:{section:'experience',id:p.id,field:'bullets'},origin:'verifier'}));
  A(raw.questions,7).forEach(q=>{
    if(!isObj(q))return;
    const ref=toRef(q.target,cv),text=S(q.text,300);
    if(!ref||!text)return;
    let options=A(q.options,6).map(o=>S(o,80)).filter(Boolean);
    const kind=q.kind==='choice'&&options.length>=2?'choice':'text';
    if(kind==='text')options=[];
    questions.push({kind,text,options,label:S(q.label,40),ref,origin:'model'});
  });
  const asked=r=>questions.some(q=>q.kind!=='confirm'&&sameRef(q.ref,r));
  const auto=(ref,text)=>{if(!asked(ref))questions.push({kind:'text',text,options:[],label:'',ref,origin:'auto'});};
  if(!cv.contact.fullName)auto({section:'contact',field:'fullName'},'Как вас зовут? Имя и фамилия пойдут в заголовок резюме.');
  if(!cv.contact.email)auto({section:'contact',field:'email'},'Укажите email для связи.');
  if(!cv.contact.phone)auto({section:'contact',field:'phone'},'Укажите телефон для связи.');
  cv.experience.forEach(e=>{if(!e.period)auto({section:'experience',id:e.id,field:'period'},'Когда вы работали'+(e.company?' в '+e.company:'')+'? Например: 2021 – 2024.');});
  if(!cv.summary)auto({section:'summary'},'Опишите в двух-трёх предложениях ваш главный опыт для этой должности.');

  const sug=suggested.filter((s,i)=>suggested.findIndex(x=>norm(x)===norm(s))===i&&!cv.skills.some(k=>norm(k)===norm(s))).slice(0,8);
  if(sug.length)questions.push({kind:'multi',text:'С чем из этого у вас есть опыт? В резюме попадёт только то, что вы отметите.',options:sug,label:'',ref:{section:'skills'},origin:'model'});
  return {cv,questions:questions.slice(0,14),suggestedRoles:A(raw.suggestedRoles,4).map(r=>S(r,80)).filter(Boolean),report};
}

function applyAnswer(cv,q,ans){
  const r=q.ref,fmt=v=>q.label?q.label+': '+v:v;
  if(q.kind==='confirm'){if(ans!=='yes')return;const e=cv.experience.find(x=>x.id===r.id);if(e)e.bullets.push(q.payload);return;}
  if(q.kind==='multi'){ans.forEach(v=>{if(!cv.skills.some(k=>norm(k)===norm(v)))cv.skills.push(v);});return;}
  if(r.section==='contact')cv.contact[r.field]=ans;
  else if(r.section==='summary')cv.summary=ans;
  else if(r.section==='skills')cv.skills.push(fmt(ans));
  else{const e=cv[r.section].find(x=>x.id===r.id);if(!e)return;if(r.field==='bullets')e.bullets.push(fmt(ans));else e[r.field]=ans;}
}

function stubGeneric(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const email=(text.match(/[^\s@,;·]+@[^\s@,;·]+\.[A-Za-zА-Яа-я]{2,}/)||[''])[0];
  const phone=(text.match(/\+?\d[\d\s()\-]{8,}\d/)||[''])[0].trim();
  const links=(text.match(/(?:https?:\/\/)?(?:www\.)?(?:github\.com|linkedin\.com|gitlab\.com)\/[^\s,;·]+/gi)||[]).slice(0,3);
  const first=lines[0]||'';
  const fullName=first.split(/\s+/).length<=4&&!/[\d@:,]/.test(first)?first:'';
  const PERIOD=/((?:19|20)\d{2})\s*[–—-]\s*((?:19|20)\d{2}|н\.\s?в\.|по\s+настоящее\s+время|настоящее\s+время|сейчас|present|now|дотепер|зараз)/i;
  const HEAD=/^(опыт|опыт работы|experience|work experience|досвід|досвід роботи|образование|education|освіта|навыки|skills|навички|о себе|summary|про себе)\s*:?$/i;
  const splitList=s=>s.split(/[,;·]/).map(x=>x.trim()).filter(Boolean);
  const experience=[],education=[],evidence=[];let skills=[],section='',cur=null;
  lines.slice(fullName?1:0).forEach(l=>{
    const sk=l.match(/^(навыки|skills|навички|стек|технологии|технології)\s*[:—-]\s*(.+)$/i);
    if(sk){skills=skills.concat(splitList(sk[2]));cur=null;return;}
    if(HEAD.test(l)){section=l.toLowerCase();cur=null;return;}
    const p=l.match(PERIOD);
    if(/образование|education|освіта/.test(section)){education.push({school:l.replace(PERIOD,'').replace(/[,\s]+$/,''),degree:'',years:p?p[0]:''});return;}
    if(/навыки|skills|навички/.test(section)){skills=skills.concat(splitList(l));return;}
    if(p){const rest=splitList(l.replace(p[0],''));cur={company:rest[0]||'',title:rest[1]||'',period:p[0],bullets:[]};experience.push(cur);return;}
    if(cur)l.split(/[.!?]\s+/).forEach(s=>{s=s.trim().replace(/[.!?]$/,'');if(s.length>8&&cur.bullets.length<6){evidence.push({path:'experience['+(experience.length-1)+'].bullets['+cur.bullets.length+']',quote:s});cur.bullets.push(s);}});
  });
  return {cv:{contact:{fullName,email,phone,city:'',links},summary:'',experience,education,skills},evidence,questions:[],suggestedRoles:[],suggestedSkills:[]};
}

/* ================= воркер: заменяет BullMQ и отдельный процесс ================= */
const worker={busy:false};
db.jobs.forEach(j=>{
  if(j.status!=='running')return;
  j.stage=null;
  if(j.mode==='claude'){j.status='failed';j.error='Страница закрылась во время запроса к Claude. Нажмите «Повторить».';j.finishedAt=Date.now();}
  else{j.status='queued';j.runAt=Date.now();}
});
persist();
async function workerTick(){
  if(worker.busy)return;
  const now=Date.now();
  const job=db.jobs.filter(j=>j.status==='queued'&&j.runAt<=now).sort((a,b)=>a.createdAt-b.createdAt)[0];
  if(!job)return;
  worker.busy=true;
  try{await runJob(job);}finally{worker.busy=false;}
}
async function runJob(job){
  const alive=()=>db.jobs.includes(job)&&db.cvs.some(c=>c.id===job.cvId);
  const stage=s=>{job.stage=s;persist();};
  const cv=db.cvs.find(c=>c.id===job.cvId);
  if(!cv){job.status='failed';job.error='Резюме удалено.';persist();return;}
  job.status='running';job.attempts++;job.error=null;stage('prompt');
  try{
    await delay(900);
    stage('generate');
    let raw;
    if(job.mode==='claude')raw=await generateWithClaude(cv);
    else{
      await delay(2600);
      if(db.flags.failFirst&&job.attempts===1)throw new Error('Воркер остановился во время генерации.');
      raw=stubModel(cv.sourceText,cv.targetRole);
    }
    if(!alive())return;
    stage('verify');await delay(1100);
    const out=verifyOutput(raw,cv.sourceText,cv.facts);
    stage('save');await delay(500);
    if(!alive())return;
    /* одна «транзакция»: черновик, вопросы и статус меняются вместе */
    cv.data=cleanCv(out.cv);cv.suggestedRoles=out.suggestedRoles;cv.report=out.report;cv.version++;cv.updatedAt=Date.now();
    db.questions=db.questions.filter(q=>q.cvId!==cv.id).concat(out.questions.map(q=>Object.assign({},q,{id:uid(),cvId:cv.id,status:'open',answer:null})));
    job.status='completed';job.stage=null;job.finishedAt=Date.now();
  }catch(e){
    if(!alive())return;
    if(!e.fatal&&job.attempts<LIMITS.maxAttempts){job.status='queued';job.stage=null;job.runAt=Date.now()+2000*job.attempts;job.lastError=e.message;}
    else{job.status='failed';job.stage=null;job.error=e.message||'Не удалось сгенерировать резюме.';job.finishedAt=Date.now();}
  }
  persist();
}

/* ================= API: заменяет REST-эндпоинты NestJS ================= */
class ApiError extends Error{constructor(status,message){super(message);this.status=status;}}
async function hashPw(pw,salt){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=0;const s=salt+'|'+pw;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'f'+h;}
}
function currentUser(){const u=db.users.find(x=>x.id===db.session);if(!u)throw new ApiError(401,'Войдите в аккаунт.');return u;}
function owned(id){const u=currentUser();const cv=db.cvs.find(c=>c.id===id&&c.userId===u.id);if(!cv)throw new ApiError(404,'Резюме не найдено.');return cv;}
const latestJob=cvId=>db.jobs.filter(j=>j.cvId===cvId).sort((a,b)=>b.createdAt-a.createdAt)[0]||null;
function jobView(j){
  if(!j)return null;
  const ahead=j.status==='queued'?db.jobs.filter(x=>x.status==='running'||(x.status==='queued'&&x.createdAt<j.createdAt)).length:0;
  return {status:j.status,stage:j.stage,attempts:j.attempts,error:j.error,mode:j.mode,queueAhead:ahead,retrying:j.status==='queued'&&j.attempts>0};
}
const cvView=cv=>({id:cv.id,targetRole:cv.targetRole,name:(cv.data&&cv.data.contact.fullName)||'',example:!!cv.example,hasData:!!cv.data,createdAt:cv.createdAt,updatedAt:cv.updatedAt,openQuestions:db.questions.filter(q=>q.cvId===cv.id&&q.status==='open').length,job:jobView(latestJob(cv.id))});
const cvFull=cv=>Object.assign(cvView(cv),{data:cv.data?clone(cv.data):null,version:cv.version,suggestedRoles:cv.suggestedRoles||[],report:cv.report||null,sourceText:cv.sourceText,questions:clone(db.questions.filter(q=>q.cvId===cv.id))});
function checkLimits(u){
  const now=Date.now(),mine=db.jobs.filter(j=>j.userId===u.id);
  const hour=mine.filter(j=>j.createdAt>now-3600e3);
  if(hour.length>=LIMITS.perHour){
    const mins=Math.max(1,Math.ceil((Math.min.apply(null,hour.map(j=>j.createdAt))+3600e3-now)/60000));
    throw new ApiError(429,'Лимит: '+LIMITS.perHour+' генераций в час. Следующая будет доступна через '+mins+' мин.');
  }
  if(mine.filter(j=>j.status==='queued'||j.status==='running').length>=LIMITS.active)throw new ApiError(429,'Уже выполняются две генерации. Дождитесь, пока одна из них закончится.');
}
function enqueue(cv,u,mode){
  db.jobs.push({id:uid(),cvId:cv.id,userId:u.id,status:'queued',stage:null,attempts:0,error:null,mode:mode==='claude'?'claude':'stub',promptVersion:'v1',createdAt:Date.now(),runAt:Date.now()});
}
function normEmail(e){return String(e||'').trim().toLowerCase();}
function seedDemo(u){
  const out=verifyOutput(stubSample(SAMPLE_ROLE),SAMPLE_TEXT,[]);
  const cv={id:uid(),userId:u.id,targetRole:SAMPLE_ROLE,sourceText:SAMPLE_TEXT,data:cleanCv(out.cv),version:1,suggestedRoles:out.suggestedRoles,report:out.report,facts:[],example:true,createdAt:Date.now(),updatedAt:Date.now()};
  db.cvs.push(cv);
  db.questions=db.questions.concat(out.questions.map(q=>Object.assign({},q,{id:uid(),cvId:cv.id,status:'open',answer:null})));
  db.jobs.push({id:uid(),cvId:cv.id,userId:u.id,status:'completed',stage:null,attempts:1,error:null,mode:'stub',promptVersion:'v1',createdAt:Date.now()-2*3600e3,runAt:0,finishedAt:Date.now()-2*3600e3});
}

    if(role.length>LIMITS.roleMax)throw new ApiError(400,'Название должности длиннее '+LIMITS.roleMax+' символов.');
    if(text.length<LIMITS.textMin)throw new ApiError(400,'Слишком мало текста: нужно хотя бы '+LIMITS.textMin+' символов об опыте.');
    if(text.length>LIMITS.textMax)throw new ApiError(413,'Текст длиннее '+LIMITS.textMax+' символов. Сократите его.');
    checkLimits(u);
    const cv={id:uid(),userId:u.id,targetRole:role,sourceText:text,data:null,version:0,suggestedRoles:[],report:null,facts:[],createdAt:Date.now(),updatedAt:Date.now()};
    db.cvs.push(cv);enqueue(cv,u,body.mode);persist();return cvView(cv);
  },
  async retry(id){
    await delay(150);const cv=owned(id),u=currentUser(),j=latestJob(id);
    if(j&&(j.status==='queued'||j.status==='running'))throw new ApiError(409,'Генерация уже идёт.');
    checkLimits(u);enqueue(cv,u,j?j.mode:'stub');persist();return cvView(cv);
  },
  async patchCv(id,data,version){
    await delay(180);const cv=owned(id);
    if(version!==cv.version)throw new ApiError(409,'Резюме изменилось в другом окне. Обновите страницу, чтобы не затереть изменения.');
    cv.data=cleanCv(data);cv.version++;cv.updatedAt=Date.now();persist();return cvFull(cv);
  },
  async answer(id,qid,body){
    await delay(180);const cv=owned(id);
    const q=db.questions.find(x=>x.id===qid&&x.cvId===id&&x.status==='open');
    if(!q)throw new ApiError(404,'Вопрос уже закрыт.');
    if(body.skip){q.status='skipped';}
    else{
      let ans;
      if(q.kind==='confirm')ans=body.value==='yes'?'yes':'no';
      else if(q.kind==='multi'){ans=A(body.values,12).map(v=>S(v,60)).filter(Boolean);if(!ans.length)throw new ApiError(400,'Отметьте хотя бы один вариант или пропустите вопрос.');}
      else{ans=S(body.value,400);if(!ans)throw new ApiError(400,'Введите ответ или пропустите вопрос.');}
      applyAnswer(cv.data,q,ans);
      q.status='answered';q.answer=ans;
      const fact=q.kind==='confirm'?(ans==='yes'?q.payload:''):Array.isArray(ans)?ans.join(', '):ans;
      if(fact){cv.facts=cv.facts||[];cv.facts.push({question:q.text,answer:fact});}
      cv.version++;cv.updatedAt=Date.now();
    }
    persist();return cvFull(cv);
  },
  async deleteCv(id){await delay(120);const cv=owned(id);db.cvs=db.cvs.filter(c=>c!==cv);db.jobs=db.jobs.filter(j=>j.cvId!==id);db.questions=db.questions.filter(q=>q.cvId!==id);persist();},
  async setFailFirst(v){db.flags.failFirst=!!v;persist();},
  async reset(){db=fresh();persist();lsSet('cvb.route',null);lsSet('cvb.draft',null);}
};

/* ================= PDF: один список блоков для предпросмотра и для файла ================= */
function cvBlocks(cv){
  const b=[],c=cv.contact||{};
  if(has(c.fullName))b.push({t:'name',text:c.fullName.trim()});
  const line=[c.email,c.phone,c.city].concat(c.links||[]).filter(has).map(s=>s.trim()).join(' · ');
  if(line)b.push({t:'contacts',text:line});
  if(has(cv.summary))b.push({t:'h',text:'О себе'},{t:'p',text:cv.summary.trim()});
  const exp=(cv.experience||[]).filter(e=>has(e.title)||has(e.company)||(e.bullets||[]).some(has));
  if(exp.length){
    b.push({t:'h',text:'Опыт'});
    exp.forEach(e=>{
      const head=[e.title,e.company].filter(has).map(s=>s.trim()).join(', ');
      if(head)b.push({t:'job',text:head});
      if(has(e.period))b.push({t:'meta',text:e.period.trim()});
      const bl=(e.bullets||[]).filter(has).map(s=>s.trim());
      if(bl.length)b.push({t:'bullets',items:bl});
    });
  }
  const edu=(cv.education||[]).filter(e=>has(e.school)||has(e.degree));
  if(edu.length){
    b.push({t:'h',text:'Образование'});
    edu.forEach(e=>{
      const head=[e.school,e.degree].filter(has).map(s=>s.trim()).join(', ');
      b.push({t:'job',text:head});
      if(has(e.years))b.push({t:'meta',text:e.years.trim()});
    });
  }
  const skills=(cv.skills||[]).filter(has).map(s=>s.trim());
  if(skills.length)b.push({t:'h',text:'Навыки'},{t:'p',text:skills.join(', ')});
  return b;
}
const scripts={};
function loadScript(src){
  if(!scripts[src])scripts[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete scripts[src];rej(new Error('load'));};document.head.appendChild(s);});
  return scripts[src];
}
async function fontB64(url){
  const r=await fetch(url);if(!r.ok)throw new Error('font');
  const bytes=new Uint8Array(await r.arrayBuffer());let bin='';
  for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
async function buildPdf(cv){
  await loadScript(URLS.jspdf);
  const fonts=await Promise.all([fontB64(URLS.fontRegular),fontB64(URLS.fontBold)]);
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  doc.addFileToVFS('cv-regular.ttf',fonts[0]);doc.addFont('cv-regular.ttf','CV','normal');
  doc.addFileToVFS('cv-bold.ttf',fonts[1]);doc.addFont('cv-bold.ttf','CV','bold');
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=50;
  let y=M;
  const write=(str,o)=>{
    o=o||{};const size=o.size||10.5,x=o.x||M;
    doc.setFont('CV',o.bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(o.gray||22);
    doc.splitTextToSize(str,W-M-x).forEach((ln,i)=>{
      if(y+size>H-M){doc.addPage();y=M;}
      y+=size;
      if(i===0&&o.bullet)doc.text('•',M+3,y);
      doc.text(ln,x,y);
      y+=size*0.4;
    });
  };
  cvBlocks(cv).forEach(b=>{
    if(b.t==='name'){write(b.text,{size:20,bold:true});y+=2;}
    else if(b.t==='contacts'){write(b.text,{size:9.5,gray:95});}
    else if(b.t==='h'){
      y+=14;if(y+40>H-M){doc.addPage();y=M;}
      write(b.text.toUpperCase(),{size:9,bold:true});
      doc.setDrawColor(205);doc.setLineWidth(0.6);doc.line(M,y+1,W-M,y+1);y+=7;
    }
    else if(b.t==='p'){write(b.text);}
    else if(b.t==='job'){y+=5;write(b.text,{size:11,bold:true});}
    else if(b.t==='meta'){write(b.text,{size:9.5,gray:95});}
    else if(b.t==='bullets'){y+=2;b.items.forEach(it=>write(it,{x:M+14,bullet:true}));}
  });
  return doc.output('blob');
}
async function extractPdf(file){
  if(file.size>LIMITS.pdfBytes)throw new Error('Файл больше 5 МБ. Загрузите файл поменьше или вставьте текст.');
  if(file.type&&file.type!=='application/pdf')throw new Error('Это не PDF. Выберите файл в формате PDF или вставьте текст.');
  let doc;
  try{
    await loadScript(URLS.pdfworker);await loadScript(URLS.pdfjs);
    doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  }catch(e){throw new Error('Не удалось прочитать PDF. Вставьте текст резюме вручную.');}
  if(doc.numPages>LIMITS.pdfPages)throw new Error('В файле больше '+LIMITS.pdfPages+' страниц. Загрузите резюме покороче или вставьте текст.');
  let text='';
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    tc.items.forEach(it=>{text+=it.str+(it.hasEOL?'\n':' ');});
    text+='\n';
  }
  text=text.replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if(text.length<50)throw new Error('В этом PDF нет текстового слоя, похоже на скан. Вставьте текст резюме вручную.');
  return {text:text.slice(0,LIMITS.textMax),pages:doc.numPages};
}

const isActive=j=>!!j&&(j.status==='queued'||j.status==='running');
const fmtTime=t=>{try{return new Intl.DateTimeFormat('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t));}catch(e){return '';}};
function usePolling(active,fn,ms){
  const ref=useRef(fn);ref.current=fn;
  useEffect(()=>{if(!active)return;const t=setInterval(()=>{ref.current();},ms);return()=>clearInterval(t);},[active,ms]);
}
function useMedia(q){
  const [m,setM]=useState(()=>window.matchMedia(q).matches);
  useEffect(()=>{const mq=window.matchMedia(q),h=()=>setM(mq.matches);mq.addEventListener('change',h);return()=>mq.removeEventListener('change',h);},[q]);
  return m;
}
function Pill({job}){
  if(!job)return null;
  return html`<span className=${'pill '+job.status}>${STATUS_LABEL[job.status]}</span>`;
}
function JobLine({job}){
  if(!job)return null;
  if(job.status==='queued')return html`<span>${job.retrying?'Сбой, повторная попытка '+(job.attempts+1)+' из '+LIMITS.maxAttempts:job.queueAhead>0?'Перед вами в очереди: '+job.queueAhead:'Скоро начнётся'}</span>`;
  if(job.status==='running')return html`<span>${STAGES[job.stage]||'Выполняется'}${job.attempts>1?' · попытка '+job.attempts:''}</span>`;
  if(job.status==='failed')return html`<span>${job.error}</span>`;
  return null;
}

  if(ref.section==='summary')return 'О себе';
  if(ref.section==='skills')return 'Навыки';
  const e=(data[ref.section]||[]).find(x=>x.id===ref.id);
  const name=e?(e.company||e.title||e.school||''):'';
  return (ref.section==='experience'?'Опыт':'Образование')+(name?' · '+name:'');
}
function QuestionCard({q,data,onAnswer}){
  const [val,setVal]=useState('');const [pick,setPick]=useState('');const [multi,setMulti]=useState([]);const [busy,setBusy]=useState(false);
  const send=async body=>{setBusy(true);await onAnswer(q.id,body);setBusy(false);};
  const other=pick==='__other';
  const toggle=o=>setMulti(m=>m.includes(o)?m.filter(x=>x!==o):m.concat(o));
  const extra=val.split(',').map(s=>s.trim()).filter(Boolean);
  return html`<div className=${'qcard'+(q.kind==='confirm'?' confirm':'')}>
    <div className="eyebrow">${refLabel(q.ref,data)}${q.origin==='verifier'?' · проверка фактов':''}</div>
    <h3>${q.text}</h3>
    ${q.kind==='confirm'&&html`<div className="quote">${q.payload}</div>
      <div className="row">
        <button className="btn btn-sm btn-primary" type="button" disabled=${busy} onClick=${()=>send({value:'yes'})}>Да, добавить в резюме</button>
        <button className="btn btn-sm" type="button" disabled=${busy} onClick=${()=>send({value:'no'})}>Нет, не добавлять</button>
      </div>`}
    ${q.kind==='choice'&&html`<div className="chips">
        ${q.options.map(o=>html`<button key=${o} type="button" className="chip" aria-pressed=${pick===o} onClick=${()=>setPick(o)}>${o}</button>`)}
        <button type="button" className="chip" aria-pressed=${other} onClick=${()=>setPick('__other')}>Другое</button>
      </div>
      ${other&&html`<input id=${'q-'+q.id} className="in" value=${val} onChange=${e=>setVal(e.target.value)} placeholder="Свой вариант" aria-label="Свой вариант" />`}`}
    ${q.kind==='multi'&&html`<div className="chips">
        ${q.options.map(o=>html`<button key=${o} type="button" className="chip" aria-pressed=${multi.includes(o)} onClick=${()=>toggle(o)}>${o}</button>`)}
      </div>
      <input id=${'q-'+q.id} className="in" value=${val} onChange=${e=>setVal(e.target.value)} placeholder="Другое, через запятую" aria-label="Другие навыки через запятую" />`}
    ${q.kind==='text'&&html`<input id=${'q-'+q.id} className="in" value=${val} onChange=${e=>setVal(e.target.value)} aria-label="Ответ" />`}
    ${q.kind!=='confirm'&&html`<div className="row">
      <button className="btn btn-sm btn-primary" type="button"
        disabled=${busy||(q.kind==='text'&&!val.trim())||(q.kind==='choice'&&(!pick||(other&&!val.trim())))||(q.kind==='multi'&&multi.length+extra.length===0)}
        onClick=${()=>send(q.kind==='multi'?{values:multi.concat(extra)}:{value:q.kind==='choice'&&!other?pick:val})}>${q.kind==='multi'?'Добавить отмеченное':'Ответить'}</button>
      <button className="btn btn-sm btn-ghost" type="button" disabled=${busy} onClick=${()=>send({skip:true})}>Пропустить</button>
    </div>`}
  </div>`;
}
function Questions({cv,data,onAnswer}){
  const open=cv.questions.filter(q=>q.status==='open'),closed=cv.questions.filter(q=>q.status!=='open'),r=cv.report;
  return html`<div className="stack">
    ${r&&html`<div className="notice small">Проверка ответа модели: пунктов опыта подтверждено цитатами из исходника — ${r.verified}; отправлено вам на подтверждение — ${r.unverified}; навыков перенесено в предложенные — ${r.skillsMoved}.</div>`}
    ${open.length===0&&html`<div className="notice ok">Открытых вопросов нет. Проверьте текст и скачайте PDF.</div>`}
    ${open.map(q=>html`<${QuestionCard} key=${q.id} q=${q} data=${data} onAnswer=${onAnswer} />`)}
    ${closed.length>0&&html`<details className="hood"><summary>Закрытые вопросы: ${closed.length}</summary>
      <div className="hood-body">${closed.map(q=>html`<div key=${q.id} className="small">
        <div>${q.text}</div>
        <div className="muted">${q.status==='skipped'?'пропущен':q.kind==='confirm'?(q.answer==='yes'?'подтверждён: '+q.payload:'отклонён: '+q.payload):Array.isArray(q.answer)?q.answer.join(', '):q.answer}</div>
      </div>`)}</div></details>`}
  </div>`;
}

function Editor({draft,setDraft}){
  const [skillsText,setSkillsText]=useState(draft.skills.join(', '));
  const [linksText,setLinksText]=useState(draft.contact.links.join(', '));
  const list=v=>v.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  const f=(id,label,value,onChange,ph)=>html`<label className="field" htmlFor=${id}><span className="lbl">${label}</span>
    <input id=${id} className="in" value=${value||''} placeholder=${ph||''} onChange=${e=>onChange(e.target.value)} /></label>`;
  const move=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;};
  return html`<div className="stack">
    <div className="sec">
      <h2>Контакты</h2>
      ${f('ed-name','Имя и фамилия',draft.contact.fullName,v=>setDraft(d=>{d.contact.fullName=v;}))}
      <div className="grid3">
        ${f('ed-email','Email',draft.contact.email,v=>setDraft(d=>{d.contact.email=v;}))}
        ${f('ed-phone','Телефон',draft.contact.phone,v=>setDraft(d=>{d.contact.phone=v;}))}
        ${f('ed-city','Город',draft.contact.city,v=>setDraft(d=>{d.contact.city=v;}))}
      </div>
      ${f('ed-links','Ссылки, через запятую',linksText,v=>{setLinksText(v);setDraft(d=>{d.contact.links=list(v);});},'github.com/…, linkedin.com/in/…')}
    </div>
    <div className="sec">
      <h2>О себе</h2>
      <label className="field" htmlFor="ed-summary"><span className="lbl">2–4 предложения под целевую должность</span>
        <textarea id="ed-summary" className="in" rows="4" value=${draft.summary} onChange=${e=>setDraft(d=>{d.summary=e.target.value;})}></textarea></label>
    </div>
    <div className="sec">
      <h2>Опыт</h2>
      ${draft.experience.length===0&&html`<p className="small muted">Мест работы пока нет. В PDF этот раздел не появится.</p>`}
      ${draft.experience.map((e,i)=>html`<div className="entry" key=${e.id}>
        <div className="grid2">
          ${f('ed-x-title-'+e.id,'Должность',e.title,v=>setDraft(d=>{d.experience[i].title=v;}))}
          ${f('ed-x-company-'+e.id,'Компания',e.company,v=>setDraft(d=>{d.experience[i].company=v;}))}
        </div>
        ${f('ed-x-period-'+e.id,'Период',e.period,v=>setDraft(d=>{d.experience[i].period=v;}),'2021 – 2024')}
        <label className="field" htmlFor=${'ed-x-bullets-'+e.id}><span className="lbl">Пункты, каждый с новой строки</span>
          <textarea id=${'ed-x-bullets-'+e.id} className="in" rows=${Math.max(3,e.bullets.length+1)} value=${e.bullets.join('\n')} onChange=${ev=>setDraft(d=>{d.experience[i].bullets=ev.target.value.split('\n');})}></textarea></label>
        <div className="row">
          <button className="btn btn-sm" type="button" disabled=${i===0} onClick=${()=>setDraft(d=>move(d.experience,i,-1))}>Выше</button>
          <button className="btn btn-sm" type="button" disabled=${i===draft.experience.length-1} onClick=${()=>setDraft(d=>move(d.experience,i,1))}>Ниже</button>
          <button className="btn btn-sm btn-ghost" type="button" onClick=${()=>setDraft(d=>{d.experience.splice(i,1);})}>Удалить место работы</button>
        </div>
      </div>`)}
      <div className="row"><button className="btn btn-sm" type="button" onClick=${()=>setDraft(d=>{d.experience.push({id:uid(),title:'',company:'',period:'',bullets:[]});})}>Добавить место работы</button></div>
    </div>
    <div className="sec">
      <h2>Образование</h2>
      ${draft.education.length===0&&html`<p className="small muted">Записей пока нет. В PDF этот раздел не появится.</p>`}
      ${draft.education.map((e,i)=>html`<div className="entry" key=${e.id}>
        ${f('ed-e-school-'+e.id,'Учебное заведение',e.school,v=>setDraft(d=>{d.education[i].school=v;}))}
        <div className="grid2">
          ${f('ed-e-degree-'+e.id,'Специальность, степень',e.degree,v=>setDraft(d=>{d.education[i].degree=v;}))}
          ${f('ed-e-years-'+e.id,'Годы',e.years,v=>setDraft(d=>{d.education[i].years=v;}),'2014 – 2018')}
        </div>
        <div className="row"><button className="btn btn-sm btn-ghost" type="button" onClick=${()=>setDraft(d=>{d.education.splice(i,1);})}>Удалить запись</button></div>
      </div>`)}
      <div className="row"><button className="btn btn-sm" type="button" onClick=${()=>setDraft(d=>{d.education.push({id:uid(),school:'',degree:'',years:''});})}>Добавить образование</button></div>
    </div>
    <div className="sec">
      <h2>Навыки</h2>
      <label className="field" htmlFor="ed-skills"><span className="lbl">Через запятую</span>
        <textarea id="ed-skills" className="in" rows="3" value=${skillsText} onChange=${e=>{const v=e.target.value;setSkillsText(v);setDraft(d=>{d.skills=list(v);});}}></textarea></label>
    </div>
  </div>`;
}

function Sheet({data}){
  const blocks=cvBlocks(data);
  return html`<div className="sheet-wrap"><div className="sheet">
    ${blocks.length===0&&html`<div className="s-empty">Резюме пока пустое.</div>`}
    ${blocks.map((b,i)=>b.t==='name'?html`<div key=${i} className="s-name">${b.text}</div>`
      :b.t==='contacts'?html`<div key=${i} className="s-contacts">${b.text}</div>`
      :b.t==='h'?html`<div key=${i} className="s-h">${b.text}</div>`
      :b.t==='job'?html`<div key=${i} className="s-job">${b.text}</div>`
      :b.t==='meta'?html`<div key=${i} className="s-meta">${b.text}</div>`
      :b.t==='bullets'?html`<ul key=${i}>${b.items.map((it,j)=>html`<li key=${j}>${it}</li>`)}</ul>`
      :html`<div key=${i}>${b.text}</div>`)}
  </div></div>`;
}
function PdfPanel({data,caps}){
  const [st,setSt]=useState({busy:false,msg:'',bad:false});
  const dl=async()=>{
    setSt({busy:true,msg:'Собираем PDF…',bad:false});
    let blob;
    try{blob=await buildPdf(data);}catch(e){setSt({busy:false,msg:'Не удалось собрать PDF. Попробуйте ещё раз.',bad:true});return;}
    try{await caps.downloads.save({filename:'cv.pdf',data:blob});setSt({busy:false,msg:'Файл передан на сохранение.',bad:false});}
    catch(e){const c=e&&e.code;setSt({busy:false,bad:c!=='declined',msg:c==='declined'?'':c==='rate_limited'?'Окно сохранения уже открыто: ответьте в нём.':'Сохранение файлов недоступно в этом окне.'});}
  };
  return html`<div className="stack">
    <div className="row">
      ${caps.downloads&&html`<button className="btn btn-primary" type="button" disabled=${st.busy} onClick=${dl}>Скачать PDF</button>`}
      <span className="hint grow">${caps.downloads?'A4, текст выделяется. В файл попадают правки из редактора, даже несохранённые.':caps.ready?'Скачивание PDF работает, когда страница открыта в Claude. Ниже предпросмотр того же листа.':'Проверяем, доступно ли скачивание…'}</span>
    </div>
    ${st.msg&&html`<div className=${'notice small'+(st.bad?' err':'')} role="status">${st.msg}</div>`}
    <${Sheet} data=${data} />
  </div>`;
}

function CvScreen({id,go,caps}){
  const [cv,setCv]=useState(null);const [draft,setDraftRaw]=useState(null);const [dirty,setDirty]=useState(false);
  const [err,setErr]=useState('');const [missing,setMissing]=useState(false);const [saving,setSaving]=useState(false);
  const [tab,setTab]=useState('editor');const [rev,setRev]=useState(0);
  const wide=useMedia('(min-width: 980px)');
  const take=c=>{setCv(c);setDraftRaw(c.data?clone(c.data):null);setDirty(false);setRev(r=>r+1);};
  const load=useCallback(async()=>{try{take(await api.getCv(id));setErr('');}catch(e){if(e.status===404)setMissing(true);else setErr(e.message);}},[id]);
  useEffect(()=>{load();},[load]);
  usePolling(!!cv&&isActive(cv.job),async()=>{
    try{const s=(await api.statuses()).find(x=>x.cvId===id);if(!s)return;if(isActive(s.job))setCv(c=>c&&Object.assign({},c,{job:s.job}));else load();}catch(e){}
  },3000);
  const setDraft=fn=>{setDraftRaw(d=>{const n=clone(d);fn(n);return n;});setDirty(true);};
  const save=async()=>{setSaving(true);try{const c=await api.patchCv(id,draft,cv.version);take(c);setErr('');return true;}catch(e){setErr(e.message);return false;}finally{setSaving(false);}};
  const answer=async(qid,body)=>{try{if(dirty&&!(await save()))return;take(await api.answer(id,qid,body));setErr('');}catch(e){setErr(e.message);}};
  const back=html`<div className="row"><button className="btn btn-ghost btn-sm" type="button" onClick=${()=>go('list')}>← Мои резюме</button></div>`;
  if(missing)return html`${back}<div className="notice err">Резюме не найдено.</div>`;
  if(!cv)return html`${back}${err?html`<div className="notice err" role="alert">${err}</div>`:html`<p className="muted">Загружаем резюме…</p>`}`;
  if(!draft){
    const j=cv.job;
    return html`${back}
      <h1>${cv.targetRole}</h1>
      ${err&&html`<div className="notice err" role="alert">${err}</div>`}
      <div className="sec" style=${{maxWidth:'640px'}}>
        <div className="row"><${Pill} job=${j} /><span className="small muted grow"><${JobLine} job=${j} /></span></div>
        ${j&&j.status==='running'&&html`<div className="bar"><i></i></div>`}
        ${isActive(j)&&html`<p className="small muted">Страницу можно закрыть или обновить: задача останется в очереди, а статус подтянется при следующем опросе.</p>`}
        ${j&&j.status==='failed'&&html`<div className="row"><button className="btn btn-primary" type="button" onClick=${async()=>{try{await api.retry(id);await load();}catch(e){setErr(e.message);}}}>Повторить генерацию</button></div>`}
      </div>`;
  }
  const openN=cv.questions.filter(q=>q.status==='open').length;
  const side=tab==='pdf'?'pdf':'questions';
  const showEditor=wide||tab==='editor';
  const showSide=wide||tab!=='editor';
  return html`${back}
    <div className="stack-sm">
      <div className="row"><h1 className="grow">${cv.targetRole}</h1>${cv.example&&html`<span className="tag">пример</span>`}</div>
      ${cv.suggestedRoles.length>0&&html`<div className="row small"><span className="muted">Вам также могут подойти:</span>
        ${cv.suggestedRoles.map(r=>html`<button key=${r} type="button" className="chip" onClick=${()=>go('new',{preset:{role:r,text:cv.sourceText}})}>${r}</button>`)}</div>`}
    </div>
    ${err&&html`<div className="notice err" role="alert">${err}</div>`}
    <div className="seg" role="group" aria-label="Раздел">
      ${!wide&&html`<button type="button" aria-pressed=${tab==='editor'} onClick=${()=>setTab('editor')}>Редактор</button>`}
      <button type="button" aria-pressed=${wide?side==='questions':tab==='questions'} onClick=${()=>setTab('questions')}>Вопросы${openN?' · '+openN:''}</button>
      <button type="button" aria-pressed=${tab==='pdf'} onClick=${()=>setTab('pdf')}>PDF</button>
    </div>
    <div className="cv-grid">
      ${showEditor&&html`<div className="panel"><${Editor} key=${rev} draft=${draft} setDraft=${setDraft} /></div>`}
      ${showSide&&html`<div className="panel">${side==='pdf'
        ?html`<${PdfPanel} data=${draft} caps=${caps} />`
        :html`<${Questions} cv=${cv} data=${draft} onAnswer=${answer} />`}</div>`}
    </div>
    ${dirty&&html`<div className="savebar" role="status">
      <span className="grow small">Есть несохранённые правки.</span>
      <button className="btn btn-sm" type="button" disabled=${saving} onClick=${()=>take(cv)}>Отменить</button>
      <button className="btn btn-sm btn-primary" type="button" disabled=${saving} onClick=${save}>${saving?'Сохраняем…':'Сохранить'}</button>
    </div>`}`;
}

function App(){
  const [user,setUser]=useState(undefined);
  const [route,setRoute]=useState(()=>lsGet('cvb.route')||{name:'list'});
  const [caps,setCaps]=useState({sample:false,downloads:null,ready:false});
  useEffect(()=>{api.me().then(setUser);},[]);
  useEffect(()=>{
    let on=true;
    const use=n=>window.claude&&typeof window.claude.use==='function'?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
    Promise.all([use('sample'),use('downloads')]).then(r=>{if(!on)return;claudeSample=r[0]||null;setCaps({sample:!!r[0],downloads:r[1]||null,ready:true});});
    return()=>{on=false;};
  },[]);
  useEffect(()=>{const t=setInterval(workerTick,700);return()=>clearInterval(t);},[]);
  const go=useCallback((name,params)=>{
    const r=Object.assign({name},params||{});setRoute(r);
    lsSet('cvb.route',r.preset?{name:'new'}:r);
    try{window.scrollTo(0,0);}catch(e){}
  },[]);
  if(user===undefined)return html`<div className="wrap" style=${{paddingBlock:'40px'}}><p className="muted">Загружаем прототип…</p></div>`;
  return html`
    <header className="topbar"><div className="wrap">
      <button className="brand" type="button" onClick=${()=>user&&go('list')}>AI CV Builder</button>
      <span className="spacer"></span>
      ${user&&html`<span className="who">${user.email}</span>
        <button className="btn btn-sm" type="button" onClick=${async()=>{await api.logout();setUser(null);go('list');}}>Выйти</button>`}
    </div></header>
    <div className="demo-strip"><div className="wrap">Прототип: API, очередь и база имитируются в браузере, данные хранятся только на этом устройстве.</div></div>
    <main className="wrap">
      ${!user?html`<${Auth} onAuth=${u=>{setUser(u);go('list');}} />`
        :route.name==='new'?html`<${NewScreen} key=${route.preset?route.preset.role:'new'} go=${go} caps=${caps} preset=${route.preset} />`
        :route.name==='cv'?html`<${CvScreen} key=${route.id} id=${route.id} go=${go} caps=${caps} />`
        :html`<${ListScreen} go=${go} caps=${caps} />`}
    </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body></html>
