# The whole stack: `docker compose up` from the repo root.
# Each subproject owns its compose file and also runs on its own (see CLAUDE.md, "Docker").
include:
  # reads the root .env (ANTHROPIC_API_KEY)
  - backend/compose.yaml
  # the web container proxies /api to the api service instead of the host, and starts after it
  - path:
      - frontend/compose.yaml
      - compose.stack.web.yaml
    env_file: compose.stack.env
